<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Наш саф</title>
<meta name="description" content="Все, кто встал с нами в ряд на пути к Каабе. Найди себя и забери своё письмо.">
<meta property="og:title" content="Наш саф — найди себя">
<meta property="og:description" content="Мы не смогли уместить всех в одно видео. Здесь стоят все.">
<meta name="theme-color" content="#1B1530">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1B1530;
    --ink: #F7F1E6;
    --muted: #CBBFA8;
    --gold: #E9C46A;
    --gold-deep: #B88A2E;
    --green: #1F6B45;
    --green-bright: #2E8B57;
    --paper: #FBF5E8;
    --paper-ink: #2A2216;
    --paper-muted: #7A6A50;
    --serif: "Alegreya", Georgia, serif;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font-family: var(--sans); overflow: hidden; overscroll-behavior: none; }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---------- верхняя панель поиска ---------- */
  .top { position: fixed; left: 0; right: 0; top: 0; padding: max(12px, env(safe-area-inset-top)) 16px 0; z-index: 20; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .count { font: 600 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); text-shadow: 0 1px 6px rgba(0,0,0,.6); margin: 0 0 8px 4px; }
  .search { position: relative; max-width: 520px; }
  .search input {
    width: 100%; height: 50px; border-radius: 14px; border: 1.5px solid rgba(233,196,106,.55);
    background: rgba(20,16,36,.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: var(--ink); font: 500 17px var(--sans); padding: 0 16px 0 44px; outline: none;
  }
  .search input::placeholder { color: #A99F8C; }
  .search input:focus { border-color: var(--gold); }
  .search svg { z-index: 2; pointer-events: none; position: absolute; left: 14px; top: 15px; width: 20px; height: 20px; color: var(--gold); }
  .results { list-style: none; margin: 6px 0 0; padding: 6px; border-radius: 14px; background: rgba(20,16,36,.95); border: 1px solid rgba(233,196,106,.25); max-height: 50vh; overflow-y: auto; display: none; }
  .results.on { display: block; }
  .results li { padding: 10px 12px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .results li:hover, .results li.sel { background: rgba(233,196,106,.14); }
  .results .u { font: 600 15px var(--sans); color: var(--ink); }
  .results .n { font: 400 13px var(--sans); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .results .none { color: var(--muted); font-size: 14px; line-height: 1.45; cursor: default; }
  .results .none:hover { background: none; }

  /* ---------- плашки с никами над головами ---------- */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .tag {
    position: absolute; left: 0; top: 0; transform-origin: 50% 100%;
    padding: 3px 8px; border-radius: 7px; white-space: nowrap;
    background: rgba(31,107,69,.92); color: #fff; font: 600 12px/1.2 var(--sans);
    border: 1px solid rgba(255,255,255,.25); box-shadow: 0 2px 8px rgba(0,0,0,.35);
    will-change: transform, opacity; display: none;
  }
  .tag::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 1px; height: 5px; background: rgba(255,255,255,.6); }
  .tag.me { background: linear-gradient(180deg, #F3D48A, #D9A93F); color: #2A1E05; font-size: 15px; padding: 6px 12px; border-color: #FFF3CF; box-shadow: 0 0 24px rgba(233,196,106,.85); }

  /* ---------- вступление ---------- */
  .intro {
    position: fixed; left: 16px; right: 16px; bottom: max(20px, env(safe-area-inset-bottom)); z-index: 15;
    max-width: 520px; margin: 0 auto; padding: 22px 22px 18px; border-radius: 20px;
    background: rgba(20,16,36,.86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(233,196,106,.35); transition: opacity .5s, transform .5s;
  }
  .intro.hide { opacity: 0; transform: translateY(20px); pointer-events: none; }
  .intro h1 { font: 700 26px/1.15 var(--serif); margin: 0 0 10px; color: var(--ink); }
  .intro p { margin: 0 0 16px; font-size: 15px; line-height: 1.5; color: var(--muted); }
  .intro b { color: var(--gold); font-weight: 600; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border: 0; border-radius: 14px;
    background: linear-gradient(180deg, #F0CF7C, #D4A43E); color: #2A1E05; font: 700 16px var(--sans); cursor: pointer; text-decoration: none;
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid rgba(233,196,106,.5); height: 46px; font-weight: 600; font-size: 15px; }
  .hint { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10; font-size: 12px; color: var(--muted); background: rgba(20,16,36,.7); padding: 6px 12px; border-radius: 99px; white-space: nowrap; opacity: 0; transition: opacity .6s; pointer-events: none; }
  .hint.on { opacity: 1; }

  /* ---------- письмо ---------- */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-height: 88vh; overflow-y: auto;
    transform: translateY(105%); transition: transform .6s cubic-bezier(.2,.8,.2,1);
    padding: 0 16px max(16px, env(safe-area-inset-bottom));
  }
  .sheet.on { transform: none; }
  .letter {
    max-width: 520px; margin: 0 auto; background: var(--paper); color: var(--paper-ink); border-radius: 18px 18px 18px 18px;
    padding: 26px 24px 22px; position: relative; box-shadow: 0 -10px 40px rgba(0,0,0,.45);
    background-image: radial-gradient(circle at 20% 0%, rgba(233,196,106,.18), transparent 50%), radial-gradient(circle at 100% 100%, rgba(31,107,69,.08), transparent 45%);
    border: 1px solid #E8D9B8;
  }
  .letter::before { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(184,138,46,.35); border-radius: 12px; pointer-events: none; }
  .close { position: absolute; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(42,34,22,.07); color: var(--paper-ink); font-size: 20px; cursor: pointer; z-index: 2; }
  .meta { font: 600 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--gold-deep); margin-bottom: 14px; }
  .letter h2 { font: 700 26px/1.2 var(--serif); margin: 0 0 6px; overflow-wrap: anywhere; }
  .place { font: italic 500 16px/1.4 var(--serif); color: var(--paper-muted); margin: 0 0 16px; }
  .letter p.body { font: 500 17.5px/1.55 var(--serif); margin: 0 0 12px; }
  .wishes { list-style: none; padding: 0; margin: 4px 0 14px; }
  .wishes li { font: 500 17.5px/1.5 var(--serif); padding: 8px 0 8px 26px; position: relative; border-top: 1px dashed rgba(184,138,46,.3); }
  .wishes li:first-child { border-top: 0; }
  .wishes li::before { content: "✦"; position: absolute; left: 4px; top: 9px; color: var(--gold-deep); font-size: 13px; }
  .amin { font: 700 20px var(--serif); color: var(--green); margin: 4px 0 2px; }
  .sign { font: italic 500 15px/1.4 var(--serif); color: var(--paper-muted); margin: 0 0 18px; }
  .keep { border-top: 1px solid rgba(184,138,46,.3); padding-top: 16px; }
  .keep h3 { font: 700 16px/1.3 var(--sans); margin: 0 0 4px; }
  .keep p { font: 400 14px/1.45 var(--sans); color: var(--paper-muted); margin: 0 0 12px; }
  .stores { display: grid; gap: 8px; }
  .store { display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 14px; background: #14110B; color: #fff; text-decoration: none; font: 600 15px var(--sans); }
  .store svg { width: 20px; height: 20px; }
  html[data-platform="ios"] .store--android, html[data-platform="android"] .store--ios { display: none; }
  .gate { display: none; margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: #FFF4D6; border: 1px solid #EBCF85; font: 400 13.5px/1.45 var(--sans); color: #5A4512; }
  html[data-webview][data-platform="ios"] .gate { display: block; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .soft { height: 44px; border-radius: 12px; border: 1px solid rgba(42,34,22,.18); background: transparent; color: var(--paper-ink); font: 600 14px var(--sans); cursor: pointer; }
  .fine { font: 400 12px/1.45 var(--sans); color: var(--paper-muted); margin: 14px 0 0; text-align: center; }
  .toast { position: fixed; left: 50%; top: 90px; transform: translateX(-50%); z-index: 50; background: rgba(20,16,36,.95); color: var(--ink); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.on { opacity: 1; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 60; background: var(--night); color: var(--muted); font: 500 15px var(--sans); transition: opacity .6s; }
  .loading.done { opacity: 0; pointer-events: none; }
  @media (min-width: 760px) { .sheet { padding-bottom: 24px; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<div class="top">
  <div class="count" id="count">Наш саф</div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Твой ник в TikTok" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <ul class="results" id="results"></ul>
  </div>
</div>

<div class="intro" id="intro">
  <h1>Мы не смогли уместить всех в одно видео</h1>
  <p>Поэтому построили этот саф. Здесь стоят все, кто написал «Амин» и подписался: <b id="introN">…</b>. Найди себя: рядом тебя ждёт письмо.</p>
  <button class="btn" id="findBtn">Найти себя</button>
</div>
<div class="hint" id="hint">Двигай пальцем, чтобы пройти вдоль рядов</div>

<div class="sheet" id="sheet">
  <article class="letter" id="letter"></article>
</div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading">Собираем саф…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= настройки ================= */
const ROW = 41, SX = 0.95, SZ = 2.3;               // мест в ряду, шаг по ряду и между рядами
const KAABA_Z = -46;
const PLAY = 'https://play.google.com/store/apps/details?id=com.way.quran_widget&referrer=utm_source%3Dtiktok%26utm_medium%3Dsaff';
const APPSTORE = 'https://apps.apple.com/app/id6764872734?ct=saff';
const AMP_KEY = '4b8a13fea0f3d4b8b1ebd118eaddaa4c';
const ROBES = ['#EFE8DA', '#F4F0E6', '#E6DCC8', '#DCD3C0', '#F7F4EC', '#CFC6B2', '#E9E1CF', '#B9C7B3', '#C9B79A', '#8FA3A8'];
const CAPS  = ['#FFFFFF', '#FFFFFF', '#F2EEE4', '#FFFFFF', '#2B2B2B', '#1F5A45', '#FFFFFF'];
const RUGS  = ['#1F5A66', '#6A3A78', '#2F6A3E', '#7A5222', '#3A3E7A', '#7A2E2E', '#2E6A6A', '#6A5A2A'];
const SKINS = ['#9C6E50', '#B5835F', '#8A5E43', '#C29270', '#7A5139'];

/* ================= платформа ================= */
const ua = navigator.userAgent || '';
const platform = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'ios' : /Android/.test(ua) ? 'android' : 'desktop';
document.documentElement.dataset.platform = platform;
const webview = /musical_ly|BytedanceWebview|Bytedance|Instagram|FBAN|FBAV/i.test(ua) || (/iPhone|iPad|iPod/.test(ua) && !/Safari\//.test(ua));
if (webview) document.documentElement.dataset.webview = '1';

/* ================= аналитика (Amplitude, платформа Web) ================= */
let deviceId = 'web-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
try { const s = localStorage.getItem('saff_did'); if (s) deviceId = s; else localStorage.setItem('saff_did', deviceId); } catch (e) {}
function track(event_type, props = {}) {
  if (!AMP_KEY || /^(127\.0\.0\.1|localhost)$/.test(location.hostname)) return;
  try {
    fetch('https://api2.amplitude.com/2/httpapi', {
      method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ api_key: AMP_KEY, events: [{ device_id: deviceId, event_type, platform: 'Web', os_name: platform, event_properties: { ...props, webview } }] }),
    }).catch(() => {});
  } catch (e) {}
}

/* ================= данные ================= */
const people = await fetch('people.json').then(r => r.json()); // [uniqueId, nickname, src]
const N = people.length;
const rowsTotal = Math.ceil(N / ROW);
const fmt = (n) => n.toLocaleString('ru-RU');
document.getElementById('count').textContent = `Наш саф · ${fmt(N)} человек`;
document.getElementById('introN').textContent = `${fmt(N)} человек`;

function placeOf(i) {
  const row = Math.floor(i / ROW), col = i % ROW;
  const inRow = row === rowsTotal - 1 ? N - row * ROW : ROW;
  return { row, col, x: (col - (inRow - 1) / 2) * SX, z: row * SZ };
}
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rnd(i, s) { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); }

/* ================= сцена ================= */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#E9A877', 70, 340);
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.5, 900);

// небо: градиент заката, солнце низко над Каабой (Мекка к западу от нас, там закат)
const SUN_DIR = new THREE.Vector3(-0.25, 0.07, -1).normalize();
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { sun: { value: SUN_DIR } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vDir; uniform vec3 sun;
    void main(){
      float h = clamp(vDir.y, -0.1, 1.0);
      vec3 horizon = vec3(0.98, 0.68, 0.42), mid = vec3(0.86, 0.48, 0.45), top = vec3(0.17, 0.16, 0.36);
      vec3 c = mix(horizon, mid, smoothstep(0.0, 0.18, h));
      c = mix(c, top, smoothstep(0.15, 0.75, h));
      float s = max(dot(normalize(vDir), sun), 0.0);
      c += vec3(1.0, 0.75, 0.45) * pow(s, 18.0) * 0.55 + vec3(1.0, 0.92, 0.75) * pow(s, 900.0) * 2.5;
      gl_FragColor = vec4(c, 1.0);
    }`,
}));
scene.add(sky);

scene.add(new THREE.HemisphereLight('#FFD9B0', '#8A6A4A', 1.15));
const sunLight = new THREE.DirectionalLight('#FFC58A', 2.1);
sunLight.position.copy(SUN_DIR).multiplyScalar(100).add(new THREE.Vector3(30, 40, 0));
scene.add(sunLight);
const fill = new THREE.DirectionalLight('#B8C4FF', 0.55);
fill.position.set(20, 30, 80);
scene.add(fill);

// земля: песок, мраморный двор под сафом и вокруг Каабы
const sand = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), new THREE.MeshStandardMaterial({ color: '#D7B07C', roughness: 1 }));
sand.rotation.x = -Math.PI / 2; scene.add(sand);
const saffDepth = rowsTotal * SZ;
const marble = new THREE.Mesh(new THREE.PlaneGeometry(ROW * SX + 16, saffDepth + (-KAABA_Z) + 40), new THREE.MeshStandardMaterial({ color: '#F1EADB', roughness: 0.55 }));
marble.rotation.x = -Math.PI / 2; marble.position.set(0, 0.04, (saffDepth + KAABA_Z) / 2 - 2); scene.add(marble);
const court = new THREE.Mesh(new THREE.CircleGeometry(26, 64), new THREE.MeshStandardMaterial({ color: '#FAF6EE', roughness: 0.4 }));
court.rotation.x = -Math.PI / 2; court.position.set(0, 0.08, KAABA_Z); scene.add(court);

// Кааба
const kaaba = new THREE.Group();
const kBox = new THREE.Mesh(new THREE.BoxGeometry(7, 8, 6.4), new THREE.MeshStandardMaterial({ color: '#141414', roughness: 0.75 }));
kBox.position.y = 4; kaaba.add(kBox);
const goldMat = new THREE.MeshStandardMaterial({ color: '#D9AE4E', emissive: '#6A4A10', emissiveIntensity: 0.6, metalness: 0.6, roughness: 0.35 });
const band = new THREE.Mesh(new THREE.BoxGeometry(7.06, 0.55, 6.46), goldMat); band.position.y = 5.6; kaaba.add(band);
const door = new THREE.Mesh(new THREE.BoxGeometry(1.3, 2.6, 0.08), goldMat); door.position.set(1.6, 3.4, 3.22); kaaba.add(door);
kaaba.position.z = KAABA_Z; scene.add(kaaba);

// галерея и минареты вокруг
const stone = new THREE.MeshStandardMaterial({ color: '#E4D6BC', roughness: 0.8 });
for (let k = 0; k < 7; k++) {
  const a = -Math.PI * 0.85 + k * (Math.PI * 1.7 / 6);
  const r = 36;
  const m = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 26, 10), stone); shaft.position.y = 13; m.add(shaft);
  const balc = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.5, 10), stone); balc.position.y = 19; m.add(balc);
  const top = new THREE.Mesh(new THREE.ConeGeometry(0.75, 4, 10), goldMat); top.position.y = 28; m.add(top);
  m.position.set(Math.sin(a) * r, 0, KAABA_Z - Math.cos(a) * r);
  if (m.position.z > KAABA_Z + 20) continue;
  scene.add(m);
}
const arcade = new THREE.Mesh(new THREE.CylinderGeometry(40, 40, 7, 64, 1, true, Math.PI * 0.62, Math.PI * 0.76), new THREE.MeshStandardMaterial({ color: '#E8DCC4', roughness: 0.85, side: THREE.DoubleSide }));
arcade.position.set(0, 3.5, KAABA_Z); scene.add(arcade);
// часовая башня вдали
const tower = new THREE.Group();
const tBody = new THREE.Mesh(new THREE.BoxGeometry(14, 70, 14), new THREE.MeshStandardMaterial({ color: '#D9C9A8', roughness: 0.8 })); tBody.position.y = 35; tower.add(tBody);
const clock = new THREE.Mesh(new THREE.CircleGeometry(4.5, 32), new THREE.MeshStandardMaterial({ color: '#F4F1E8', emissive: '#5FA36E', emissiveIntensity: 0.5 })); clock.position.set(0, 60, 7.05); tower.add(clock);
const spire = new THREE.Mesh(new THREE.ConeGeometry(4, 26, 8), goldMat); spire.position.y = 83; tower.add(spire);
tower.position.set(-20, 0, KAABA_Z - 120); scene.add(tower);
// горы Хиджаза кольцом
const rockMat = new THREE.MeshStandardMaterial({ color: '#9A6E4C', roughness: 1, flatShading: true });
for (let k = 0; k < 26; k++) {
  const a = (k / 26) * Math.PI * 2, r = 230 + rnd(k, 1) * 80, h = 30 + rnd(k, 2) * 50;
  const m = new THREE.Mesh(new THREE.ConeGeometry(40 + rnd(k, 3) * 30, h, 6), rockMat);
  m.position.set(Math.sin(a) * r, h / 2 - 2, KAABA_Z + Math.cos(a) * r); m.rotation.y = rnd(k, 4) * 3;
  scene.add(m);
}

/* ================= люди (instanced) ================= */
function cloth(rTop, rBot, h, folds = 9, amp = 0.04, seg = 18) {
  const g = new THREE.CylinderGeometry(rTop, rBot, h, seg, 3, false);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), r = Math.hypot(x, z);
    if (r < 1e-4) continue;
    const th = Math.atan2(z, x), low = 0.35 + 0.65 * (0.5 - y / h);
    const k = 1 + amp * low * (Math.sin(folds * th) + 0.4 * Math.sin(folds * 2.3 * th + 1.3));
    p.setX(i, x * k); p.setZ(i, z * k);
  }
  return g;
}

function updateLabels() {
  const W = innerWidth, H = innerHeight;
  const t = controls.target;
  const dist = camera.position.distanceTo(t);
  let used = 0;
  if (dist < 34) {
    const rowC = Math.round(t.z / SZ), span = dist < 14 ? 5 : 8;
    const cand = [];
    for (let r = Math.max(0, rowC - span); r <= Math.min(rowsTotal - 1, rowC + span); r++) {
      for (let c = 0; c < ROW; c++) {
        const i = r * ROW + c; if (i >= N || i === found) continue;
        const dx = pos[i * 3] - camera.position.x, dz = pos[i * 3 + 2] - camera.position.z;
        cand.push([dx * dx + dz * dz + (pos[i*3+1]), i]);
      }
    }
    cand.sort((a, b) => a[0] - b[0]);
    const maxD2 = (dist < 14 ? 15 : 26) ** 2;
    const boxes = [];
    for (const [d2, i] of cand) {
      if (used >= POOL || d2 > maxD2) break;
      proj.set(pos[i * 3], 2.02, pos[i * 3 + 2]).project(camera);
      if (proj.z > 1 || proj.x < -1.1 || proj.x > 1.1 || proj.y < -1.1 || proj.y > 1.1) continue;
      const sx = (proj.x + 1) / 2 * W, sy = (1 - proj.y) / 2 * H;
      const scale = THREE.MathUtils.clamp(9 / Math.sqrt(d2), 0.55, 1.15);
      const w = 70 * scale, h = 22 * scale;
      if (boxes.some(b => Math.abs(b[0] - sx) < (b[2] + w) / 2 && Math.abs(b[1] - sy) < (b[3] + h) / 2)) continue;
      boxes.push([sx, sy, w, h]);
      const el = tags[used++];
      const txt = handle(people[i]);
      if (el.textContent !== txt) el.textContent = txt;
      el.style.display = 'block';
      el.style.transform = `translate(-50%, -100%) translate(${sx}px, ${sy}px) scale(${scale})`;
      el.style.opacity = String(THREE.MathUtils.clamp(1.4 - Math.sqrt(d2) / (Math.sqrt(maxD2)), 0.35, 1));
    }
  }
  for (let k = used; k < POOL; k++) tags[k].style.display = 'none';
  if (found >= 0) {
    proj.set(pos[found * 3], 2.15, pos[found * 3 + 2]).project(camera);
    if (proj.z < 1) {
      meTag.style.display = 'block';
      meTag.style.transform = `translate(-50%, -100%) translate(${(proj.x + 1) / 2 * W}px, ${(1 - proj.y) / 2 * H}px)`;
    } else meTag.style.display = 'none';
  } else meTag.style.display = 'none';
}

const norm = (s) => (s || '').toLowerCase().replace(/^@+/, '').replace(/\s+/g, ' ').trim();
const index = people.map((p, i) => [norm(p[0]), norm(p[1]), i]);
const qEl = document.getElementById('q'), resEl = document.getElementById('results');
let lastQ = '', searchTimer = null;
function search(q) {
  q = norm(q);
  if (!q) return [];
  const exact = [], starts = [], has = [];
  for (const [u, n, i] of index) {
    if (u === q || n === q) exact.push(i);
    else if (u.startsWith(q) || n.startsWith(q)) starts.push(i);
    else if (q.length >= 3 && (u.includes(q) || n.includes(q))) has.push(i);
  }
  return [...exact, ...starts, ...has].slice(0, 8);
}
function renderResults(q) {
  const list = search(q);
  if (!norm(q)) { resEl.classList.remove('on'); return; }
  resEl.innerHTML = list.length
    ? list.map((i, k) => `<li data-i="${i}" class="${k === 0 ? 'sel' : ''}"><span class="u">${esc(handle(people[i]))}</span>${people[i][1] && people[i][0] ? `<span class="n">${esc(people[i][1])}</span>` : ''}</li>`).join('')
    : `<li class="none">Пока не нашли тебя. Напиши «Иду» под последним роликом @quran.widget.app — добавим в следующий раз.</li>`;
  resEl.classList.add('on');
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { if (norm(q) !== lastQ) { lastQ = norm(q); track('saff_search', { len: lastQ.length, found: list.length > 0 }); } }, 900);
}

    beam.material.uniforms.o.value = o;
    ring.material.opacity = o * (0.9 - (t % 1.6) / 1.6 * 0.9);
    ring.scale.setScalar(1 + (t % 1.6) * 0.9);
  }
  if ((frame++ & 1) === 0 || fly) updateLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
document.getElementById('loading').classList.add('done');
track('saff_open', { ref: document.referrer ? new URL(document.referrer).hostname : '', link: !!new URLSearchParams(location.search).get('n') });

// открытие: облёт от Каабы к сафу, или сразу к человеку по ссылке ?n=
const linkN = norm(new URLSearchParams(location.search).get('n') || '');
const linked = linkN ? index.find(([u, n]) => u === linkN || n === linkN) : null;
if (linked) { hideIntro(); setTimeout(() => pick(linked[2], true), 300); }
else flyTo(OVERVIEW.pos.clone(), OVERVIEW.look.clone(), 4.5, 0);
</script>
</body>
